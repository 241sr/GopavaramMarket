<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locality Shop Tracker</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .control-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 12px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3); width: 260px; font-size: 13px;
        }
        .control-panel input, .control-panel button {
            width: 100%; margin-top: 6px; padding: 8px; box-sizing: border-box;
        }
        .control-panel button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .control-panel button:hover { background: #0056b3; }
        .status-text { color: #555; font-size: 11px; margin-top: 4px; display: block; }
    </style>
</head>
<body>

    <div class="control-panel">
        <b>Shop Mapper</b><br>
        <span class="status-text" id="targetStatus">📍 Tap map to select location</span>
        <input type="text" id="shopName" placeholder="Shop Name">
        <input type="text" id="shopLink" placeholder="Or paste Maps Link (Optional)">
        <button onclick="addShop()">Save Shop</button>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
        const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";

        var map = L.map('map').setView([14.45, 78.82], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let shopMarkers = [];
        let selectedLat = null;
        let selectedLng = null;
        let tempMarker = null;

        // Fetch and render existing shops from Google Sheet database
        function loadShops() {
            fetch(SCRIPT_URL + "?action=getShops")
            .then(response => response.json())
            .then(shops => {
                shopMarkers.forEach(m => map.removeLayer(m));
                shopMarkers = [];

                shops.forEach(shop => {
                    let popupContent = `<b>${shop.name}</b><br><br>` +
                                       `<a href="${shop.link}" target="_blank">🗺️ Navigate</a><br><br>` +
                                       `<button onclick="deleteShop('${shop.id}')" style="background:red;color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;">Delete Shop</button>`;
                    
                    let marker = L.marker([shop.lat, shop.lng]).addTo(map).bindPopup(popupContent);
                    shopMarkers.push(marker);
                });
            });
        }

        // Tap on map to drop a temporary pin and record coordinates instantly
        map.on('click', function(e) {
            selectedLat = e.latlng.lat;
            selectedLng = e.latlng.lng;

            // Remove previous temp pin if it exists
            if (tempMarker) {
                map.removeLayer(tempMarker);
            }

            // Drop a visual temporary red/orange highlight pin
            tempMarker = L.marker([selectedLat, selectedLng], {
                opacity: 0.7
            }).addTo(map).bindPopup("Selected Location").openPopup();

            document.getElementById('targetStatus').innerHTML = `✅ Location pinned! Ready to save.`;
            document.getElementById('targetStatus').style.color = "green";
        });

        // Add a new shop via Apps Script to Google Sheet
        function addShop() {
            let name = document.getElementById('shopName').value;
            let customLink = document.getElementById('shopLink').value.trim();

            if (!name) {
                alert("Please enter a shop name!");
                return;
            }

            let lat = selectedLat;
            let lng = selectedLng;
            let link = "";

            // If user pasted a manual Google Maps link instead of clicking the map, use it
            if (customLink) {
                link = customLink;
                // Try to extract lat/lng if it's a standard coords link, otherwise fallback to defaults if not clicked
                if (!lat || !lng) {
                    lat = 14.45; lng = 78.82; // Fallback center if no map pin was tapped
                }
            } else if (lat && lng) {
                link = `https://maps.google.com/?q=${lat},${lng}`;
            } else {
                alert("Please either tap a spot on the map OR paste a Google Maps link!");
                return;
            }

            // Send data to Google Sheet
            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "addShop", name: name, lat: lat, lng: lng, link: link })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    document.getElementById('shopName').value = "";
                    document.getElementById('shopLink').value = "";
                    document.getElementById('targetStatus').innerHTML = "📍 Tap map to select location";
                    document.getElementById('targetStatus').style.color = "#555";
                    
                    if (tempMarker) {
                        map.removeLayer(tempMarker);
                        tempMarker = null;
                    }
                    selectedLat = null;
                    selectedLng = null;

                    loadShops(); // Refresh map pins instantly
                }
            });
        }

        // Delete shop from Google Sheet
        function deleteShop(id) {
            if(confirm("Are you sure you want to delete this shop?")) {
                fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "deleteShop", id: id })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === "success") {
                        loadShops();
                    }
                });
            }
        }

        // Load shops on startup
        loadShops();

        // LIVE GPS TRACKING
        if (navigator.geolocation) {
            var userMarker = null;
            navigator.geolocation.watchPosition(function(position) {
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;

                if (!userMarker) {
                    userMarker = L.circleMarker([lat, lng], {
                        radius: 8, fillColor: "#007bff", color: "#fff", weight: 2, opacity: 1, fillOpacity: 0.9
                    }).addTo(map).bindPopup("You are here");
                } else {
                    userMarker.setLatLng([lat, lng]);
                }
            });
        }
    </script>
</body>
</html>
