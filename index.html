<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locality Shop Tracker</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; }

        /* Floating Input Dashboard */
        .control-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 12px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3); width: 250px; font-size: 13px;
        }
        .control-panel input, .control-panel button {
            width: 100%; margin-top: 6px; padding: 8px; box-sizing: border-box;
        }
        .control-panel button { 
            background: #007bff; color: white; border: none; border-radius: 4px; 
            cursor: pointer; font-weight: bold; 
        }
        .control-panel button:hover { background: #0056b3; }
        .status-text { color: #555; font-size: 11px; margin-top: 4px; display: block; }

        /* Floating GPS Recenter Button */
        .gps-btn {
            position: absolute; bottom: 25px; right: 20px; z-index: 1000;
            background: white; border: none; border-radius: 50%;
            width: 48px; height: 48px; box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; cursor: pointer;
        }
        .gps-btn:active { background: #e0e0e0; }

        /* Custom Permanent Label on Pins */
        .shop-label {
            background: rgba(0, 0, 0, 0.8) !important;
            color: #fff !important;
            border: none !important;
            border-radius: 4px !important;
            padding: 2px 6px !important;
            font-size: 11px !important;
            font-weight: bold !important;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        .leaflet-tooltip-bottom:before {
            border-bottom-color: rgba(0, 0, 0, 0.8) !important;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <b>Shop Mapper</b><br>
        <span class="status-text" id="targetStatus">📍 Tap map to select location</span>
        <input type="text" id="shopName" placeholder="Shop Name">
        <input type="text" id="shopLink" placeholder="Or paste Maps Link (Optional)">
        <button onclick="addShop()">Save Shop</button>
    </div>

    <!-- Live GPS Recenter Button -->
    <button class="gps-btn" onclick="goToCurrentLocation()" title="Locate Me">🎯</button>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwrFXO0nyEIlaS86O60GvzKDrl1Fxm8K3n6glruXNTSUcSjUr__mbhxyFFru8_JTfYf/exec";

        // 1. BASE MAP LAYERS
        // OpenStreetMap (Standard Street Map)
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '© OpenStreetMap'
        });

        // Google Hybrid (Satellite Imagery + Street Labels)
        const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '© Google Maps'
        });

        // Initialize map with Google Hybrid by default
        var map = L.map('map', {
            center: [14.7335, 79.0545], // Badvel town area center coordinates
            zoom: 16,
            layers: [googleHybrid]
        });

        // Layer Switcher Control (Top-Left toggle)
        const baseMaps = {
            "🛰️ Satellite / Hybrid": googleHybrid,
            "🗺️ Street Map": osm
        };
        L.control.layers(baseMaps, null, { position: 'topleft' }).addTo(map);

        let shopMarkers = [];
        let selectedLat = null;
        let selectedLng = null;
        let tempMarker = null;
        let userCoords = null;
        let userMarker = null;

        // 2. FETCH AND DISPLAY SAVED SHOPS WITH PERMANENT LABELS
        function loadShops() {
            fetch(SCRIPT_URL + "?action=getShops")
            .then(response => response.json())
            .then(shops => {
                shopMarkers.forEach(m => map.removeLayer(m));
                shopMarkers = [];

                shops.forEach(shop => {
                    let popupContent = `<b>${shop.name}</b><br><br>` +
                                       `<a href="${shop.link}" target="_blank">🗺️ Open in Google Maps</a><br><br>` +
                                       `<button onclick="deleteShop('${shop.id}')" style="background:#dc3545;color:white;border:none;padding:5px 8px;border-radius:4px;cursor:pointer;">Delete Shop</button>`;
                    
                    let marker = L.marker([shop.lat, shop.lng]).addTo(map).bindPopup(popupContent);

                    // Add visible shop name directly on/below pin
                    marker.bindTooltip(shop.name, {
                        permanent: true,
                        direction: 'bottom',
                        className: 'shop-label',
                        offset: [0, 8]
                    });

                    shopMarkers.push(marker);
                });
            });
        }

        // Tap on map to set spot
        map.on('click', function(e) {
            selectedLat = e.latlng.lat;
            selectedLng = e.latlng.lng;

            if (tempMarker) {
                map.removeLayer(tempMarker);
            }

            tempMarker = L.marker([selectedLat, selectedLng], { opacity: 0.8 }).addTo(map);
            document.getElementById('targetStatus').innerHTML = `✅ Point selected! Ready to save.`;
            document.getElementById('targetStatus').style.color = "#28a745";
        });

        // 3. ADD SHOP TO GOOGLE SHEET
        function addShop() {
            let name = document.getElementById('shopName').value.trim();
            let customLink = document.getElementById('shopLink').value.trim();

            if (!name) {
                alert("Please enter a shop name!");
                return;
            }

            let lat = selectedLat;
            let lng = selectedLng;
            let link = "";

            if (customLink) {
                link = customLink;
                if (!lat || !lng) {
                    lat = 14.7335; lng = 79.0545;
                }
            } else if (lat && lng) {
                link = `https://maps.google.com/?q=${lat},${lng}`;
            } else {
                alert("Please tap a spot on the map first!");
                return;
            }

            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "addShop", name: name, lat: lat, lng: lng, link: link })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    document.getElementById('shopName').value = "";
                    document.getElementById('shopLink').value = "";
                    document.getElementById('targetStatus').innerHTML = "📍 Tap map to select location";
                    document.getElementById('targetStatus').style.color = "#555";
                    
                    if (tempMarker) {
                        map.removeLayer(tempMarker);
                        tempMarker = null;
                    }
                    selectedLat = null;
                    selectedLng = null;

                    loadShops();
                }
            });
        }

        // 4. DELETE SHOP FROM GOOGLE SHEET
        function deleteShop(id) {
            if(confirm("Are you sure you want to delete this shop?")) {
                fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "deleteShop", id: id })
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === "success") {
                        loadShops();
                    }
                });
            }
        }

        // 5. GPS LOCATION TRACKING & RECENTER BUTTON
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function(position) {
                userCoords = [position.coords.latitude, position.coords.longitude];

                if (!userMarker) {
                    userMarker = L.circleMarker(userCoords, {
                        radius: 8,
                        fillColor: "#007bff",
                        color: "#ffffff",
                        weight: 3,
                        opacity: 1,
                        fillOpacity: 0.95
                    }).addTo(map).bindPopup("You are here");
                } else {
                    userMarker.setLatLng(userCoords);
                }
            }, function(err) {
                console.log("GPS Location Error: " + err.message);
            }, { enableHighAccuracy: true });
        }

        function goToCurrentLocation() {
            if (userCoords) {
                map.flyTo(userCoords, 18, { animate: true, duration: 1.2 });
            } else {
                alert("Acquiring GPS location... Make sure Location/GPS is turned on in your browser!");
            }
        }

        // Initialize existing pins on load
        loadShops();
    </script>
</body>
</html>
